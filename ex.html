<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover thoughtful travel experiences that support local communities and protect the places we love.">
    <meta name="theme-color" content="#173e35">
    <title>Terra & Tide | Travel that gives back</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18332c;
            --muted: #69766f;
            --green: #173e35;
            --green-light: #315e4d;
            --cream: #f7f6f0;
            --paper: #fffefa;
            --orange: #e99458;
            --line: #e6e7de;
            --serif: Georgia, "Times New Roman", serif;
            --sans: "Segoe UI", Arial, sans-serif;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }
        button, input { font: inherit; }
        img { display: block; max-width: 100%; }
        .container { width: min(1160px, calc(100% - 48px)); margin-inline: auto; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 37px;
            padding: 7px 18px;
            background: #e9efe6;
            color: #385b49;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .045em;
            text-align: center;
        }
        .topbar span { color: var(--green-light); font-size: 14px; }

        .site-header {
            position: relative;
            z-index: 2;
            background: var(--paper);
        }
        .nav-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 76px;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--green);
            font-family: var(--serif);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.045em;
        }
        .brand-mark { width: 30px; height: 30px; }
        .nav-links { display: flex; align-items: center; gap: 34px; }
        .nav-links a {
            color: #59675f;
            font-size: 13px;
            font-weight: 600;
            transition: color .2s ease;
        }
        .nav-links a:hover, .nav-links a:focus-visible { color: var(--green-light); }
        .nav-cta, .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 0;
            border-radius: 4px;
            background: var(--green);
            color: white !important;
            font-size: 12px !important;
            font-weight: 700 !important;
            letter-spacing: .02em;
            transition: background .2s ease, transform .2s ease;
        }
        .nav-cta { padding: 13px 18px; }
        .button { min-height: 49px; padding: 0 22px; }
        .nav-cta:hover, .button:hover { background: #275646; transform: translateY(-1px); }
        .nav-cta span, .button span { font-size: 16px; }
        .menu-toggle {
            display: none;
            width: 42px;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: transparent;
            color: var(--green);
            font-size: 21px;
            cursor: pointer;
        }

        .hero {
            position: relative;
            display: flex;
            align-items: center;
            min-height: 560px;
            overflow: hidden;
            background:
                linear-gradient(90deg, rgba(14, 37, 31, .79) 0%, rgba(18, 42, 34, .58) 46%, rgba(18, 42, 34, .12) 100%),
                url("https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=2000&q=85") center 54% / cover,
                #466d66;
            color: white;
        }
        .hero-content { position: relative; width: min(1160px, calc(100% - 48px)); margin: 0 auto; padding: 76px 0 94px; }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 22px;
            color: #d4e1d6;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .19em;
            text-transform: uppercase;
        }
        .eyebrow::before { width: 26px; height: 1px; background: var(--orange); content: ""; }
        h1, h2, h3, p { margin-top: 0; }
        .hero h1 {
            max-width: 660px;
            margin-bottom: 19px;
            font-family: var(--serif);
            font-size: clamp(44px, 6.4vw, 76px);
            font-weight: 400;
            letter-spacing: -.055em;
            line-height: 1.04;
        }
        .hero h1 em { color: #f1b27c; font-weight: 400; }
        .hero-copy {
            max-width: 465px;
            margin-bottom: 29px;
            color: rgba(255, 255, 255, .84);
            font-size: 14px;
            line-height: 1.8;
